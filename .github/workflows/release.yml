name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish or repair
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build release
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Run tests
        run: xcrun swift test

      - name: Build app bundle
        run: ./scripts/build-app.sh

      - name: Archive app bundle
        run: ditto -c -k --sequesterRsrc --keepParent PingBar.app PingBar.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" PingBar.zip --clobber
          else
            gh release create "$RELEASE_TAG" PingBar.zip --generate-notes --title "PingBar $RELEASE_TAG"
          fi

  homebrew:
    name: Update Homebrew cask
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Two tags pushed close together must not race on the same cask commit.
    concurrency:
      group: homebrew-cask
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      TAP_REPOSITORY: melonask/homebrew-pingbar

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Skip releases that are not the latest
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          if [ "$latest" = "$RELEASE_TAG" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$RELEASE_TAG is not the latest release ($latest); leaving the cask unchanged."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate cask
        if: steps.latest.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PINGBAR_REPOSITORY: ${{ github.repository }}
          # The release job above has already uploaded the final asset.
          PINGBAR_RELEASE_PUBLISHED: "1"
        run: ./scripts/update-cask.sh "$RELEASE_TAG"

      - name: Check out tap
        if: steps.latest.outputs.publish == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ env.TAP_REPOSITORY }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Publish to tap
        if: steps.latest.outputs.publish == 'true'
        working-directory: tap
        run: |
          cp ../Casks/pingbar.rb Casks/pingbar.rb
          if git diff --quiet -- Casks/pingbar.rb; then
            echo "Tap already has the cask for $RELEASE_TAG."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/pingbar.rb
          git commit -m "Update PingBar to ${RELEASE_TAG#v}"
          git push origin HEAD

      - name: Commit cask to main
        if: steps.latest.outputs.publish == 'true'
        run: |
          if git diff --quiet -- Casks/pingbar.rb; then
            echo "Casks/pingbar.rb already points at $RELEASE_TAG."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/pingbar.rb
          git commit -m "Point the cask at ${RELEASE_TAG#v}"
          git pull --rebase origin main
          git push origin HEAD:main
