name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build release
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run tests
        run: xcrun swift test

      - name: Build app bundle
        run: ./scripts/build-app.sh

      - name: Archive app bundle
        run: ditto -c -k --sequesterRsrc --keepParent PingBar.app PingBar.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" PingBar.zip --generate-notes --title "PingBar $GITHUB_REF_NAME"
