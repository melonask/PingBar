name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish or repair
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build release
    runs-on: macos-15
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Run tests
        run: xcrun swift test

      - name: Build app bundle
        run: ./scripts/build-app.sh

      - name: Archive app bundle
        run: ditto -c -k --sequesterRsrc --keepParent PingBar.app PingBar.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" PingBar.zip --clobber
          else
            gh release create "$RELEASE_TAG" PingBar.zip --generate-notes --title "PingBar $RELEASE_TAG"
          fi
